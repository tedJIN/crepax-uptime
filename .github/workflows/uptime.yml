name: crepax uptime (보조 감시)

# 크레팍스의 **보조** 장애 감시입니다. 주 감시는 Supabase 안의 크론(1분 · 관리자 문자)인데,
# 그건 Supabase DB 자체가 죽으면 같이 멈춥니다. 이 저장소는 바깥(GitHub)에서 15분마다 봐서
# 그 빈틈을 메웁니다. 실패하면 job 이 실패하고 GitHub 가 저장소 주인에게 메일을 보냅니다.
#
# 비밀값은 없습니다 — 공개 주소만 봅니다. (공개 저장소라 Actions 무료 · 무제한)
# GitHub 스케줄은 5~15분씩 밀릴 수 있어 보조용입니다.

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17 3 1 * *"   # 매달 1일 — 아래 keepalive (60일 활동이 없으면 GitHub 가 스케줄을 끕니다)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    if: github.event.schedule != '17 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 상태 점검 (3번까지 다시 시도)
        run: |
          for url in https://crepax.co.kr/api/v1/health https://crepax.co.kr/; do
            ok=0
            for i in 1 2 3; do
              code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 -A crepax-uptime "$url" || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 20
            done
            if [ $ok -ne 1 ]; then
              echo "::error::$url → HTTP $code"
              head -c 300 /tmp/body || true
              exit 1
            fi
            echo "$url OK"
          done

  keepalive:
    if: github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > .keepalive
          git config user.name "crepax-uptime"
          git config user.email "actions@users.noreply.github.com"
          git add .keepalive && git commit -m "keepalive" && git push
